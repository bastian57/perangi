name: Build PERANGI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # untuk publish rolling release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK sudah preinstalled di runner ubuntu-latest
      # (ANDROID_HOME / ANDROID_SDK_ROOT), jadi tanpa setup-android.

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log (selalu, biar build merah bisa didiagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: perangi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Rilis rolling "latest": setiap build hijau langsung bisa diunduh
      # publik + dibaca fitur "Cek Pembaruan" di aplikasi.
      - name: Rename APK for stable download URL
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk perangi.apk

      - name: Publish rolling release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PERANGI — Build Terbaru"
          body: |
            Build otomatis dari GitHub Actions (commit ${{ github.sha }}).
            Unduh `perangi.apk`, install, ikuti onboarding di aplikasi.
          prerelease: false
          files: perangi.apk
